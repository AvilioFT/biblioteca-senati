# Configuración LDAP (JNDI real)
# Modo: embedded (demo con UnboundID, sin servidor externo) | external (LDAP real)
ldap.mode=embedded

# --- LDAP embebido (demo) ---
ldap.embedded.port=10389
ldap.embedded.baseDn=dc=senati,dc=edu,dc=pe
ldap.embedded.bindDn=cn=admin,dc=senati,dc=edu,dc=pe
ldap.embedded.bindPassword=admin123

# --- LDAP externo (activar con ldap.mode=external) ---
ldap.external.url=ldap://localhost:389
ldap.external.baseDn=dc=senati,dc=edu,dc=pe
ldap.external.bindDn=cn=admin,dc=senati,dc=edu,dc=pe
ldap.external.bindPassword=admin123
ldap.external.userFilter=(uid=%s)
ldap.external.activeAttribute=employeeType
ldap.external.activeValue=active
